:root{
  --bg:#F8F4F0;--bg2:#F1EBE5;--card:#FFFFFF;--ink:#2F2A27;--ink2:#6A615B;--ink3:#8C837C;
  --line:#EAE2DA;--line2:#DCD2C8;--shadow:0 1px 2px rgba(70,50,40,.05),0 10px 30px rgba(70,50,40,.06);
  --a:#94665F;--a1:#F4E6E3;--a2:#E7CDC8;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC;
  --ok:#3F6E48;--okbg:#E0EDE2;--warn:#86601B;--warnbg:#F6EBD3;--bad:#A0412F;--badbg:#F6DFDA;
  --p1:#E7A1A6;--p2:#9DCBA6;--p3:#B5A3D8;--p4:#97BFE0;--p5:#E3C08E;--p6:#F0AE95;--p7:#8FCFC6;--p8:#D39CC4;--p9:#C2C08A;--p10:#A3B1C4;
  --r:20px;--fs:16px;--serif:"Bodoni",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme="Sage"]{--a:#5E7C64;--a1:#E5EEE6;--a2:#C9DDCC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Lavender"]{--a:#76689A;--a1:#ECE7F4;--a2:#D6CCE8;--b:#4F7193;--b1:#E3ECF5;--b2:#C8D9EA}
[data-theme="Sky"]{--a:#4F7193;--a1:#E3ECF5;--a2:#C8D9EA;--b:#76689A;--b1:#ECE7F4;--b2:#D6CCE8}
[data-theme="Sand"]{--a:#8A6D4E;--a1:#F2E9DE;--a2:#E3D2BD;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC}
[data-theme="Stone"]{--a:#6B635D;--a1:#EEEAE6;--a2:#DAD3CC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Mocha"]{--a:#6F5146;--a1:#F1E6E0;--a2:#DDC8BE;--b:#A3603F;--b1:#F7E7DD;--b2:#ECCDB9}
[data-theme="Ocean"]{--a:#3F6B78;--a1:#E1EDF0;--a2:#C3DAE0;--b:#8A6D4E;--b1:#F2E9DE;--b2:#E3D2BD}
[data-theme="Plum"]{--a:#73465F;--a1:#F2E5EC;--a2:#E2C8D6;--b:#9A5F7E;--b1:#F6E8EF;--b2:#EBCFDD}
[data-theme="Noir"]{--a:#34302D;--a1:#ECE8E3;--a2:#D9D2C9;--b:#8C6F3A;--b1:#F4ECDC;--b2:#E6D5B2}
html[data-dark="1"]{
  --bg:#1B1918;--bg2:#24211F;--card:#2A2725;--ink:#F3EEEA;--ink2:#BDB4AD;--ink3:#8D847D;--line:#38332F;--line2:#4A443F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --ok:#9CC8A5;--okbg:#2B3A2E;--warn:#E3BA72;--warnbg:#3D3324;--bad:#EC9E8F;--badbg:#45302B;color-scheme:dark;
}
/* the theme sits on <body>; dark tints must be set there too or the light tints win */
html[data-dark="1"] body[data-theme],html[data-dark="1"]{--a1:color-mix(in srgb,var(--a) 30%,#2A2725);--a2:color-mix(in srgb,var(--a) 50%,#9A928B);--b1:color-mix(in srgb,var(--b) 30%,#2A2725);--b2:color-mix(in srgb,var(--b) 50%,#9A928B)}
html[data-dark="1"] body[data-theme="Noir"]{--a:#57504A}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
h1{font-size:2.1em;line-height:1.08;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.3em;line-height:1.2}
h3{font-size:1.05em}
.caps{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:.87em}.tiny{font-size:.77em}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.hidden{display:none!important}
.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}

/* ------------------------------------------------ layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:250px;flex:none;padding:24px 14px 20px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.brand{padding:2px 12px 16px}
.brand .k{font-size:.62em;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.32em;display:block;line-height:1.1;margin-top:3px;letter-spacing:.02em}
.brand .arch{width:30px;height:34px;color:var(--a);margin-bottom:8px}
.navlabel{padding:14px 12px 5px;font-size:.64em}
.nav{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-size:.94em;border:0;background:none;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.nav:hover{background:var(--bg2)}
.nav.on{background:var(--a);color:#fff;font-weight:500}
.nav.on svg{color:#fff}
.nav .badge{margin-left:auto}
.side .addbtn{margin:2px 0 6px;justify-content:center}
.main{flex:1;min-width:0;padding:28px 36px 120px;max-width:1240px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar .sub{margin-top:5px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.tabbar{display:none}
.mt{margin-top:18px}.mt0{margin-top:0}

/* ------------------------------------------------ cards with a colored title band (our signature) */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-width:0;overflow:hidden}
.card>.band{background:var(--a);color:#fff;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.card>.band.b{background:var(--b)}
.card>.band.soft{background:var(--a1);color:var(--ink)}
.card>.band.softb{background:var(--b1);color:var(--ink)}
.band .t{font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.band .r{font-size:.8em;opacity:.9;display:flex;gap:8px;align-items:center}
.band .lnk{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:20px;padding:4px 11px;font-size:.92em}
.band.soft .lnk,.band.softb .lnk{background:var(--card)}
.card>.body{padding:18px 20px}
.card>.body.tight{padding:8px 20px 12px}
.card.pad{padding:18px 20px}
.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
/* key number tiles (like the spreadsheet) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);text-align:center;min-width:0;display:flex;flex-direction:column}
.tile>b{flex:1;display:flex!important;align-items:center;justify-content:center;padding:8px!important}
.grid.start{align-items:start}
.tiles{grid-auto-rows:1fr}
.tile .h{background:var(--a1);font-size:.66em;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:8px 6px;color:var(--ink)}
.tile:nth-child(even) .h{background:var(--b1)}
.tile b{display:block;font-family:var(--serif);font-weight:500;font-size:1.65em;padding:10px 8px 2px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:.78em;color:var(--ink2);padding:0 8px 11px}
.tile .s.ok{color:var(--ok)}.tile .s.bad{color:var(--bad)}

/* hero: safe to spend */
.hero{background:var(--b1);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--b2) 60%,transparent);text-align:center;display:flex;flex-direction:column}
.hero .band{background:var(--b);color:#fff;padding:11px 16px;font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.hero .in{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-family:var(--serif);font-weight:500;font-size:3.9em;line-height:1;letter-spacing:-.01em;display:inline-flex;align-items:flex-start;gap:2px;font-variant-numeric:tabular-nums}
.big .cur{font-size:.4em;margin-top:.3em;opacity:.7}
.big .ct{font-size:.4em;margin-top:.3em;opacity:.7}
.big.neg{color:var(--bad)}
.hero .line{color:var(--b);font-weight:500;margin-top:8px;font-size:.98em}
html[data-dark="1"] .hero .line{color:var(--ink)}
.hero .math{margin-top:12px;background:var(--card);border-radius:14px;padding:9px 14px;font-size:.84em;width:100%;max-width:340px;text-align:left}
.hero .math div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.hero .math .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:500}
.hero .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--card);border-radius:30px;padding:9px 16px;font-size:.92em;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.pri2{background:var(--b);border-color:var(--b);color:#fff}
.btn.soft{background:var(--a1);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:.84em}
.btn.danger{color:var(--bad)}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--bg2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.link{border:0;background:none;padding:0;color:var(--a);text-decoration:underline;text-underline-offset:3px;font-size:.88em;cursor:pointer}
html[data-dark="1"] .link{color:var(--a2)}
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:max(11.5px,.74em);font-weight:500;background:var(--a1);color:var(--ink);white-space:nowrap}
.badge.b{background:var(--b1)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.seg{display:inline-flex;background:var(--bg2);border-radius:30px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:30px;padding:6px 13px;font-size:.86em;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.monthpick{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line2);border-radius:30px;padding:3px}
.monthpick b{font-weight:500;min-width:128px;text-align:center;font-size:.94em}
.monthpick .iconbtn{width:30px;height:30px;border-radius:50%}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item.click:hover .nm{text-decoration:underline;text-underline-offset:3px}
.nm{font-weight:500}
.date{width:44px;flex:none;text-align:center;border-radius:11px;background:var(--bg2);padding:5px 0 4px;line-height:1.05}
.date b{display:block;font-family:var(--serif);font-weight:500;font-size:1.18em}
.date span{font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.date.a{background:var(--a1)}.date.b{background:var(--b1)}.date.ok{background:var(--okbg)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.emo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:1.05em;background:var(--bg2)}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line2);border-radius:14px;font-size:.92em}
.dayhead{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:14px 0 4px;font-weight:500}
.dayhead:first-child{padding-top:0}
.tag{font-size:.72em;background:var(--b1);border-radius:10px;padding:1px 7px;margin-left:6px}
table.t{width:100%;border-collapse:collapse;font-size:.88em}
table.t th{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:500;text-align:right;padding:8px 6px;background:var(--b1);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:500;border-top:2px solid var(--line2)}
table.t td.over{background:var(--badbg);color:var(--bad)}
table.t td.cur{background:var(--a1)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* progress */
.bar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--b);transition:width .6s}
.bar.a i{background:var(--a)}
.bar.over i{background:var(--bad)}
.bar.thick{height:13px}
.bar.mark{position:relative;overflow:visible}
.bar.mark u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);border-radius:2px}
.budrow{padding:11px 0;border-top:1px solid var(--line)}
.budrow:first-child{border-top:0}
.budrow .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:baseline}
.budrow .sub2{display:flex;justify-content:space-between;font-size:.78em;color:var(--ink2);margin-top:4px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:.8em;color:var(--ink2);font-weight:500}
.inp{width:100%;border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 13px;outline:none;font-size:1em;min-width:0}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 16%,transparent)}
.inp.sm{padding:6px 9px;font-size:.9em;border-radius:9px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{font-size:.78em;color:var(--ink3)}
.switch{position:relative;width:44px;height:26px;border-radius:20px;background:var(--line2);border:0;padding:0;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--b)}.switch.on:after{left:21px}
input[type=range]{width:100%;accent-color:var(--a)}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .e{width:54px;text-align:center;flex:none}.erow .n{flex:1 1 150px;min-width:0}.erow .a{width:100px;flex:none}.erow .g{width:110px;flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(40,30,25,.38);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s}
.modal{background:var(--card);border-radius:24px;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .22s}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 12px;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:1.2em}
.modal .mb{padding:16px 22px 18px}
.modal .mf{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.modal .mf .btn{flex:1 1 auto;justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}

/* add sheet */
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:12px}
.kind button{border:0;background:none;border-radius:11px;padding:8px;font-weight:500;color:var(--ink2)}
.kind button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amountview{text-align:center;padding:2px 0 6px}
.amountview input{border:0;background:none;text-align:center;font-family:var(--serif);font-size:2.8em;width:100%;outline:none;padding:0;font-variant-numeric:tabular-nums}
.plus{display:flex;gap:8px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
.plus button{border:0;background:var(--a1);border-radius:30px;padding:6px 13px;font-weight:500;font-size:.86em}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 12px}
.cat{border:1.5px solid var(--line2);background:var(--card);border-radius:30px;padding:6px 12px;font-size:.86em;display:inline-flex;gap:6px;align-items:center}
.cat.on{border-color:var(--a);background:var(--a1);font-weight:500}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2F2A27;color:#fff;border-radius:16px;padding:11px 12px 11px 18px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.28);animation:pop .25s;max-width:calc(100vw - 28px);font-size:.92em}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;padding:6px 13px;font-weight:500}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:center;padding:4px 0;font-weight:500}
.cday{min-height:96px;border-radius:12px;background:var(--bg2);padding:6px 7px;display:flex;flex-direction:column;gap:3px;border:1.5px solid transparent;min-width:0;text-align:left}
.cday.out{opacity:.3}
.cday.today{border-color:var(--a);background:var(--card)}
.cday.ns{background:var(--b1)}
.cday .d{font-size:.8em;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.ev{font-size:.68em;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border-left:3px solid var(--a)}
.ev.income{border-left-color:var(--ok);background:var(--okbg)}
.ev.sub{border-left-color:var(--p3)}.ev.debt{border-left-color:var(--bad)}.ev.save{border-left-color:var(--b)}
.ev.spend{border-left:0;background:transparent;padding-left:1px;color:var(--ink2)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini i{aspect-ratio:1;border-radius:4px;background:var(--bg2);font-style:normal;font-size:.56em;display:grid;place-items:center;color:var(--ink3)}
.mini i.ns{background:var(--b);color:#fff}.mini i.sp{background:var(--a1);color:var(--ink2)}.mini i.x{background:none}
.minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 18px}
.minis h4{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:.95em;display:flex;justify-content:space-between}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink2);font-size:10.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.86em}
.legend div{display:flex;align-items:center;gap:9px}
.legend .v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;flex:none;white-space:nowrap}
.legend .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78em;color:var(--ink2);margin-top:8px}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.hleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donutwrap{display:flex;gap:16px;align-items:center}
.donutwrap .legend{flex:1;min-width:0}
.flow{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.flow i{display:block;height:100%;min-width:3px}
.tip{position:fixed;z-index:80;background:#2F2A27;color:#fff;font-size:12px;border-radius:8px;padding:5px 9px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-120%)}

/* goals */
.jar{width:44px;height:58px;flex:none}
.goal .bigsum{font-family:var(--serif);font-size:1.8em;line-height:1.1}
.bigdate{font-family:var(--serif);font-size:2.5em;line-height:1.05}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .iconbtn{border:1px solid var(--line2);border-radius:50%;width:30px;height:30px}

/* onboarding */
.ob{max-width:580px;margin:5vh auto;padding:0 18px 60px}
.ob .steps{display:flex;gap:6px;margin:0 0 22px}
.ob .steps i{height:5px;flex:1;border-radius:5px;background:var(--line2)}
.ob .steps i.on{background:var(--a)}
.banner{background:var(--a);color:#fff;font-size:.85em;padding:8px 16px;text-align:center;position:sticky;top:0;z-index:40}
.banner a{color:#fff;font-weight:500}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.themes button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 7px;font-size:.78em;display:flex;flex-direction:column;align-items:center;gap:6px}
.themes button.on{border-color:var(--ink)}
.themes .sw{display:flex;width:100%;height:22px;border-radius:7px;overflow:hidden}
.themes .sw i{flex:1}

/* ------------------------------------------------ responsive */
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){
  .g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}
  .main{padding:24px 22px 120px}
}
@media (max-width:760px){
  .side{display:none}
  .main{padding:16px 14px 110px;max-width:none}
  h1{font-size:1.55em}
  .big{font-size:3.2em}
  .card>.body{padding:15px 15px}
  .card>.band{padding:10px 14px}
  .topbar{margin-bottom:14px;align-items:flex-start}
  .topbar .acts .hide-m{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .tile b{font-size:1.4em}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .donutwrap{flex-direction:column;align-items:stretch}.donutwrap svg{align-self:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .tabbar a,.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink);text-decoration:none;padding:4px 6px;min-width:56px}
  .tabbar a svg,.tabbar button svg{width:21px;height:21px}
  .tabbar a.on{color:var(--a)}
  html[data-dark="1"] .tabbar a.on{color:var(--a2)}
  .tabbar .fab{width:52px;height:52px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px color-mix(in srgb,var(--a) 40%,transparent);min-width:0;padding:0}
  .tabbar .fab svg{width:24px;height:24px}
  .cday{min-height:54px;padding:4px}
  .ev{font-size:0;padding:0;height:5px;border-left:0;background:var(--a);border-radius:3px}
  .ev.income{background:var(--ok)}.ev.sub{background:var(--p3)}.ev.debt{background:var(--bad)}.ev.save{background:var(--b)}
  .ev.spend{font-size:9px;height:auto;background:none;color:var(--ink2)}
  .cal{gap:3px}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:24px 24px 0 0;max-height:94dvh;max-width:none}
  .toast{bottom:92px}
  .monthpick b{min-width:104px}
}
@media print{.side,.tabbar,.topbar .acts{display:none}.main{padding:0}}
.item>svg{width:18px;height:18px;flex:none;color:var(--ink3)}
.nextcard .body{flex-wrap:wrap}.nextcard .grow{flex:1 1 220px}
@media (max-width:760px){.nextcard .nbtns{width:100%;justify-content:flex-start!important;padding-left:58px}}
@media (max-width:760px){.topbar .simpletog{display:none}}
.obhead,.obrow{display:grid;grid-template-columns:34px minmax(0,1fr) 104px 150px 156px 34px;gap:8px;align-items:center}
.obhead{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:500;padding-bottom:6px}
.obrow{padding:7px 0;border-top:1px solid var(--line)}.obrow .e{text-align:center;font-size:1.15em}
.ob{max-width:760px}
@media (max-width:760px){.obhead{display:none}.obrow{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 34px;row-gap:6px}.obrow [data-obf=name]{grid-column:2/4}.obrow .iconbtn{grid-column:4;grid-row:1}.obrow [data-obf=amount]{grid-column:2}.obrow select{grid-column:3}.obrow [data-obf=next]{grid-column:2/4}}

/* ------------------------------------------------ debt payoff tracker */
.show-m{display:none!important}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}

.tots.t3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tots.t3 div{padding:10px 10px}.tots.t3 b{font-size:1.15em}

<script>window.BP_DEMO=false;window.BP_SHOP="https://www.etsy.com/shop/TrueHavenStudios";window.BP_VERSION="1.0.0";window.BP_SHORTCUT_URL="https://www.icloud.com/shortcuts/02348d1db5064627b9bc4ecc8b31f327";window.BP_GOOGLE_CLIENT_ID="";window.BP_REQUIRE_LOGIN=true;</script>
<script>/* Fitness Planner engine: dates, Health sync parsing, streaks, readiness, cycle phases, records, insights, reports. No DOM. */
const E = (() => {
  // ------------------------------------------------------------ dates (local, 'YYYY-MM-DD')
  const pad = n => String(n).padStart(2, "0");
  const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
  const diff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();
  const ym = s => s.slice(0, 7);
  const ymAdd = (m, n) => { const [y, mo] = m.split("-").map(Number), k = y * 12 + mo - 1 + n; return `${Math.floor(k / 12)}-${pad(k % 12 + 1)}`; };
  const dow = s => (pd(s).getDay() + 6) % 7;            // 0 = Monday … 6 = Sunday
  const weekStart = s => addDays(s, -dow(s));
  const r1 = v => Math.round(v * 10) / 10;
  const sum = (a, f = x => x) => a.reduce((s, x) => s + (+f(x) || 0), 0);
  const avg = a => a.length ? sum(a) / a.length : null;
  const range = (a, b) => { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; };

  // ------------------------------------------------------------ reading what the Shortcut sends
  // Values arrive as text in the phone's own format: "4353", "4’353", "4.353", "3,1 km", "312.4 kcal", "62,5 kg", "8 h 12 min" …
  function parseNum(raw, kind) {
    if (raw == null) return null;
    let s = String(raw).replace(/ | /g, " ").trim();
    if (!s) return null;
    const m = s.match(/-?\d[\d'’ .,]*/); if (!m) return null;
    let t = m[0].trim().replace(/['’ ]/g, "");
    const seps = t.match(/[.,]/g) || [];
    if (seps.length) {
      const last = Math.max(t.lastIndexOf("."), t.lastIndexOf(",")), tail = t.length - last - 1;
      const mixed = t.includes(".") && t.includes(",");
      let decimal;
      if (mixed) decimal = true;                                     // 1,234.5 or 1.234,5 – the last one is the decimal mark
      else if (seps.length > 1) decimal = false;                     // 1.234.567 – grouping only
      else if (tail !== 3) decimal = true;                           // 3,1 or 62.45 – decimal
      else decimal = kind === "dec";                                 // 3.100: steps → 3100, km/kg → 3.1
      t = decimal ? t.slice(0, last).replace(/[.,]/g, "") + "." + t.slice(last + 1) : t.replace(/[.,]/g, "");
    }
    const v = parseFloat(t);
    return isFinite(v) ? v : null;
  }
  // keys the Shortcut can send → [day field, kind]
  const SYNC = { st: ["steps", "int"], di: ["dist", "dec"], fl: ["floors", "int"], ak: ["akcal", "int"], ex: ["exmin", "int"], wt: ["weight", "dec"],
    fo: ["food", "int"], pr: ["protein", "int"], wa: ["water", "int"], sl: ["sleep", "dec"], rh: ["rhr", "int"], hv: ["hrv", "int"] };
  // plausible ranges after conversion – anything outside is a unit mix-up and is skipped
  const LIM = { steps: [0, 100000], dist: [0, 300], floors: [0, 500], akcal: [0, 10000], exmin: [0, 1440], weight: [20, 400], food: [0, 20000], protein: [0, 1000], water: [0, 15000], sleep: [0, 24], rhr: [25, 250], hrv: [1, 300] };
  function parseSync(q, unitPref) {
    // q: "st=4353&di=3.1 km&wt=62,5 kg" (already URL-decoded or not); unitPref: "metric" | "imperial" – used when a value comes without a unit
    const imp = unitPref === "imperial";
    let s = String(q || "");
    try { s = decodeURIComponent(s.replace(/\+/g, " ")); } catch (e) { }
    const out = {}, units = {};
    s.split(/[&\n;|]/).forEach(part => {
      const i = part.indexOf("="); if (i < 0) return;
      const k = part.slice(0, i).trim().toLowerCase(), raw = part.slice(i + 1).trim();
      if (k === "d" && /^\d{4}-\d\d-\d\d$/.test(raw)) { out.date = raw; return; }
      const def = SYNC[k]; if (!def) return;
      let v = parseNum(raw, def[1]); if (v == null) return;
      const low = raw.toLowerCase(), unitless = !/[a-zµ]/.test(low);
      if (def[0] === "dist") { if (/\bmi\b|mile/.test(low)) v *= 1.609344; else if (/\bm\b/.test(low) && !/km/.test(low) && v > 50) v /= 1000; else if (unitless && imp) v *= 1.609344; }
      if (def[0] === "weight") { if (/lb|pfund/.test(low)) v *= 0.45359237; else if (/st\b|stone/.test(low) && v < 60) v *= 6.35029318; else if (unitless && imp) v *= 0.45359237; }
      if (def[0] === "water") { if (/oz/.test(low)) v *= 29.5735; else if (/\bl\b|liter|litre/.test(low) && !/ml/.test(low) && v < 20) v *= 1000; else if (unitless && v < 20) v *= 1000; else if (unitless && imp && v < 400) v *= 29.5735; }
      if (def[0] === "sleep") { const h = low.match(/(\d+)\s*(h|std)/), mi = low.match(/(\d+)\s*min/); if (h || mi) v = (h ? +h[1] : 0) + (mi ? +mi[1] / 60 : 0); else if (/\bs\b|sec/.test(low) || v > 24 * 60) v /= 3600; else if (v > 24) v /= 60; }
      if (def[0] === "akcal" && /kj/.test(low)) v /= 4.184;
      if (def[0] === "food" && /kj/.test(low)) v /= 4.184;
      if (v < 0) return;
      if (v === 0 && !["steps", "dist", "floors"].includes(def[0])) return;   // 0 = nothing recorded (no watch, no food app …)
      const lim = LIM[def[0]]; if (lim && (v < lim[0] || v > lim[1])) return;
      out[def[0]] = def[1] === "int" ? Math.round(v) : Math.round(v * 100) / 100;
      units[def[0]] = raw;
    });
    return { vals: out, raw: units };
  }

  // ------------------------------------------------------------ kinds of workouts
  const KINDS = { strength: ["Strength", "🏋️", 3], cardio: ["Cardio", "🏃", 2], hiit: ["HIIT", "⚡", 3], yoga: ["Yoga", "🧘", 1], pilates: ["Pilates", "🤸", 1],
    walk: ["Walk", "🚶", 1], bike: ["Cycling", "🚴", 2], swim: ["Swim", "🏊", 2], sport: ["Sport", "⚽", 2], dance: ["Dance", "💃", 2], other: ["Other", "✨", 2] };
  const kindOf = k => KINDS[k] || KINDS.other;
  // how hard a session was: effort the user picked, else the kind's typical load
  const load = w => (w.effort || kindOf(w.kind)[2]) * Math.max(10, +w.min || 30) / 30;

  // ------------------------------------------------------------ one day
  const day = (S, t) => S.days[t] || {};
  const workoutsOn = (S, t) => S.workouts.filter(w => w.date === t);
  const planFor = (S, t) => { const v = (S.week || [])[dow(t)]; return v === "rest" ? { rest: true } : v ? (S.templates.find(x => x.id === v) || null) : null; };
  // planned item status for a date
  function planStatus(S, t) {
    const p = planFor(S, t), ws = workoutsOn(S, t), d = day(S, t);
    if (p && p.rest) return { p, ws, status: ws.length ? "bonus" : "rest" };
    if (p) {
      const hit = ws.find(w => w.tpl === p.id) || ws.find(w => w.kind === p.kind);
      return { p, ws, hit, status: hit ? "done" : ws.length ? "swapped" : d.rest ? "rest" : t < today0(S) ? "missed" : "planned" };
    }
    return { p: null, ws, status: ws.length ? "bonus" : d.rest ? "rest" : "free" };
  }
  const today0 = S => (typeof today === "function" ? today() : "9999");
  // a day "counts" for the streak if you trained, rested on purpose, or hit your step goal
  function kept(S, t) {
    const d = day(S, t), st = planStatus(S, t);
    if (st.ws.length) return true;
    if (d.rest || (st.p && st.p.rest)) return true;
    return (d.steps || 0) >= (S.settings.stepGoal || 1e9);
  }
  function streak(S, t) {
    const start = S.created || t; let n = 0, d = t;
    if (!kept(S, d)) d = addDays(d, -1);
    while (d >= start && kept(S, d)) { n++; d = addDays(d, -1); }
    return n;
  }
  function bestStreak(S, a, b) {
    let best = 0, cur = 0;
    for (const d of range(a < (S.created || a) ? S.created || a : a, b)) { if (kept(S, d)) { cur++; best = Math.max(best, cur); } else cur = 0; }
    return best;
  }
  const minutesOn = (S, t) => sum(workoutsOn(S, t), w => w.min);
  // 0 nothing · 1 step goal / rest · 2 short workout · 3 workout · 4 long or hard workout
  function level(S, t) {
    const ws = workoutsOn(S, t), m = sum(ws, w => w.min), d = day(S, t);
    if (ws.length) return m >= 50 || ws.some(w => (w.effort || 0) >= 3 && m >= 30) ? 4 : m >= 25 ? 3 : 2;
    if (d.rest) return 1;
    const p = planFor(S, t); if (p && p.rest && t >= (S.created || t) && t <= today0(S)) return 1;
    return (d.steps || 0) >= (S.settings.stepGoal || 1e9) ? 1 : 0;
  }

  // ------------------------------------------------------------ week
  function week(S, t) {
    const a = weekStart(t), days = range(a, addDays(a, 6)).map(x => ({ date: x, ...planStatus(S, x) }));
    const done = sum(days, x => x.ws.length);                       // workouts this week – the same unit as the weekly goal everywhere
    const planned = days.filter(x => x.p && !x.p.rest).length;
    return { days, done, planned, goal: S.settings.perWeek || planned || 3, minutes: sum(days, x => sum(x.ws, w => w.min)), steps: sum(days, x => day(S, x.date).steps || 0) };
  }

  // ------------------------------------------------------------ cycle
  function cycleInfo(S, t) {
    const c = S.settings; if (!c.cycle) return null;
    const P = [...(S.periods || [])].filter(x => x <= t).sort();
    if (!P.length) return { none: true };
    // learn the cycle length from the last few cycles (21–40 days) – else the setting
    const all = [...S.periods].sort(), gaps = [];
    for (let i = 1; i < all.length; i++) { const g = diff(all[i - 1], all[i]); if (g >= 21 && g <= 40) gaps.push(g); }
    const len = gaps.length ? Math.round(avg(gaps.slice(-4))) : (c.cycleLen || 28), plen = c.periodLen || 5;
    const last = P[P.length - 1];
    let dayN = diff(last, t) + 1, predicted = false;
    if (dayN > len) { predicted = true; dayN = ((dayN - 1) % len) + 1; }
    const ov = len - 14;
    let phase;
    if (dayN <= plen) phase = "menstrual";
    else if (dayN < ov - 1) phase = "follicular";
    else if (dayN <= ov + 1) phase = "ovulation";
    else if (dayN <= ov + 7) phase = "luteal";
    else phase = "late";
    let next = addDays(last, len); while (next <= t) next = addDays(next, len);
    return { day: dayN, len, plen, phase, next, last, predicted, ov, learned: gaps.length > 0 };
  }
  const PHASES = {
    menstrual: ["Period", "🌙", "Energy is often lower. Gentle moves count: walks, yoga, mobility, light strength.", "gentle"],
    follicular: ["Follicular", "🌱", "Energy usually climbs. A great time for strength, new skills and trying a heavier weight.", "build"],
    ovulation: ["Ovulation", "☀️", "Often your strongest days. Go for a record, sprints or your hardest session.", "peak"],
    luteal: ["Luteal", "🍂", "Steady does it: moderate strength and cardio. Fuel well – you may be hungrier.", "steady"],
    late: ["Late luteal", "🕯️", "PMS days for many. Lower the intensity: pilates, walks, stretching. Rest is training too.", "gentle"]
  };
  // where each day of a month sits in the cycle (for the calendar)
  function phaseOn(S, t) { const c = cycleInfo(S, t); return c && !c.none ? c : null; }

  // ------------------------------------------------------------ readiness (0–100) from what we know
  function readiness(S, t) {
    const d = day(S, t), st = S.settings, parts = [];
    let score = 0, weight = 0;
    const add = (name, v, w, note) => { score += v * w; weight += w; parts.push([name, v, note]); };
    if (d.sleep > 0) add("Sleep", Math.min(1, d.sleep / (st.sleepGoal || 8)), 35, `${r1(d.sleep)} h of ${st.sleepGoal || 8} h`);
    if (d.feel) add("How you feel", (d.feel - 1) / 4, 30, ["", "rough", "meh", "okay", "good", "great"][d.feel]);
    if (d.sore != null && d.sore !== "") add("Soreness", [1, .55, .15][+d.sore] ?? .6, 15, ["none", "a little", "very"][+d.sore]);
    // training load of the last two days
    const w2 = [addDays(t, -1), addDays(t, -2)].flatMap(x => workoutsOn(S, x)), l2 = sum(w2, load), n2 = w2.length;
    add("Recovery", l2 <= .5 ? 1 : l2 <= 2.5 ? .8 : l2 <= 4.5 ? .55 : .3, 20, !n2 ? "fresh – no training the last 2 days" : `${n2 === 1 ? "one session" : n2 + " sessions"} in the last 2 days${l2 > 4.5 ? " – a heavy load" : l2 > 2.5 ? " – a solid load" : ""}`);
    // watch data: compare with your own 14-day normal
    const back = range(addDays(t, -14), addDays(t, -1)).map(x => day(S, x));
    const hb = avg(back.map(x => x.hrv).filter(x => x > 0)), rb = avg(back.map(x => x.rhr).filter(x => x > 0));
    let adj = 0;
    if (d.hrv > 0 && hb && back.filter(x => x.hrv > 0).length >= 5) { const k = (d.hrv - hb) / hb; adj += clampN(k * 40, -10, 8); parts.push(["HRV", clampN(.5 + k * 2, 0, 1), `${Math.round(d.hrv)} ms vs your usual ${Math.round(hb)}`]); }
    if (d.rhr > 0 && rb && back.filter(x => x.rhr > 0).length >= 5) { const k = (d.rhr - rb) / rb; adj += clampN(-k * 60, -10, 5); parts.push(["Resting heart rate", clampN(.5 - k * 3, 0, 1), `${Math.round(d.rhr)} bpm vs your usual ${Math.round(rb)}`]); }
    const c = cycleInfo(S, t);
    if (c && !c.none && (c.phase === "menstrual" || c.phase === "late")) { adj -= 4; parts.push(["Cycle", .4, PHASES[c.phase][0].toLowerCase() + " phase"]); }
    const known = !!(d.sleep > 0 || d.feel);
    const v = Math.round(clampN((weight ? score / weight * 100 : 60) + adj, 0, 100));
    const lv = v >= 75 ? ["Ready for a hard one", "Go for it – a heavy day, a record or your toughest workout.", 3] : v >= 55 ? ["Good for a steady session", "Train as planned, at a comfortable effort.", 2] : v >= 40 ? ["Keep it light today", "A walk, yoga or a lighter version of your plan.", 1] : ["Rest and recover", "Sleep, stretch, walk – rest days make you stronger.", 0];
    return { score: v, label: lv[0], tip: lv[1], tier: lv[2], parts, known };
  }
  const clampN = (v, a, b) => Math.max(a, Math.min(b, v));

  // ------------------------------------------------------------ strength: last values and records
  const exKey = n => String(n || "").trim().toLowerCase().replace(/\s+/g, " ");
  const e1rm = (w, r) => w > 0 ? w * (1 + Math.min(r || 1, 15) / 30) : 0;
  function sortedWorkouts(S) { return [...S.workouts].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0)); }
  // the best set of an exercise entry (entries may hold every set, or just one summary set)
  function topSet(e) {
    const sets = Array.isArray(e.sets) && e.sets.length ? e.sets.filter(x => x && (+x.r > 0 || +x.w > 0)) : [];
    if (!sets.length) return { w: +e.w || 0, r: +e.r || 0 };
    return sets.reduce((a, x) => e1rm(+x.w || 0, +x.r || 0) > e1rm(a.w, a.r) || (a.w === 0 && +x.r > a.r) ? { w: +x.w || 0, r: +x.r || 0 } : a, { w: +sets[0].w || 0, r: +sets[0].r || 0 });
  }
  function lastFor(S, name, before) {
    const k = exKey(name), ws = sortedWorkouts(S).filter(w => !before || w.date < before).reverse();
    for (const w of ws) { const x = (w.ex || []).find(e => exKey(e.n) === k); if (x) return { ...x, ...topSet(x), date: w.date }; }
    return null;
  }
  // one point per workout: the best set that day
  function exHistory(S, name) {
    const k = exKey(name), out = [];
    sortedWorkouts(S).forEach(w => (w.ex || []).forEach(e => { if (exKey(e.n) !== k) return; const t = topSet(e); if (t.w > 0 || t.r > 0) out.push({ date: w.date, w: t.w, r: t.r, v: e1rm(t.w, t.r), vol: sum(Array.isArray(e.sets) && e.sets.length ? e.sets : [{ w: e.w, r: e.r }], x => (+x.w || 0) * (+x.r || 0)) * (Array.isArray(e.sets) && e.sets.length ? 1 : (+e.s || 1)) }); }));
    return out;
  }
  // exercises you log most, newest first on a tie
  function exercises(S) {
    const c = {}; sortedWorkouts(S).forEach(w => (w.ex || []).forEach(e => { const k = exKey(e.n); if (!k) return; const t = topSet(e); if (!(t.w > 0)) return; c[k] = c[k] || { name: e.n, n: 0, last: "" }; c[k].n++; c[k].last = w.date; c[k].name = e.n; }));
    return Object.values(c).sort((a, b) => b.n - a.n || (a.last < b.last ? 1 : -1));
  }
  // every record: {key, name, w, r, date, wid}. pr flag = beat a previous best
  function records(S) {
    const best = {}, prs = [];
    sortedWorkouts(S).forEach(w => (w.ex || []).forEach(e0 => {
      const t = topSet(e0), e = { n: e0.n, w: t.w, r: t.r };
      const k = exKey(e.n), v = e1rm(+e.w || 0, +e.r || 0); if (!k || !(v > 0)) return;
      const b = best[k];
      if (!b || v > b.v * 1.002) { if (b) prs.push({ key: k, name: e.n, w: +e.w, r: +e.r, date: w.date, wid: w.id, prev: b }); best[k] = { v, name: e.n, w: +e.w, r: +e.r, date: w.date, wid: w.id }; }
    }));
    return { best, prs };
  }

  // ------------------------------------------------------------ insights (only when there's enough data)
  function insights(S, t) {
    const out = [], from = addDays(t, -120 + 1), days = range(from < S.created ? S.created : from, t);
    const D = days.map(x => ({ date: x, ...day(S, x), min: minutesOn(S, x), n: workoutsOn(S, x).length }));
    // 1) sleep → next day's training
    const pairs = D.slice(1).map((x, i) => ({ sl: D[i + 1].sleep, min: x.min })).filter(x => x.sl > 0);
    const pairs2 = D.map(x => ({ sl: x.sleep, min: x.min })).filter(x => x.sl > 0);
    const P = pairs2.length >= pairs.length ? pairs2 : pairs;
    const good = P.filter(x => x.sl >= 7), low = P.filter(x => x.sl < 7);
    if (good.length >= 4 && low.length >= 4) {
      const a = avg(good.map(x => x.min)), b = avg(low.map(x => x.min));
      if (b > 0 && a > b * 1.08) out.push({ id: "sleep", icon: "😴", title: `You train ${Math.round((a / b - 1) * 100)}% longer after 7+ hours of sleep`, text: `${Math.round(a)} minutes on average vs ${Math.round(b)} after shorter nights.`, strength: a / b });
      else if (a > 0 && b > a * 1.08) out.push({ id: "sleep", icon: "😴", title: "Short nights don't stop you", text: `You still average ${Math.round(b)} training minutes after less than 7 hours – but watch your recovery.`, strength: 1.05 });

/* forms: helpers, check-in, edit a day, log a workout, workout templates, week picker, ready-made plans, periods, Health sync, story card */
const num = v => { if (v == null) return NaN; const x = E.parseNum(v, "dec"); return x == null ? NaN : x; };
const numInt = v => { if (v == null) return NaN; const x = E.parseNum(v, "int"); return x == null ? NaN : x; };   // steps, kcal, ml … : "8,500" = 8500
const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
const opt = (v, l, sel) => `<option value="${esc(v)}" ${String(v) === String(sel) ? "selected" : ""}>${esc(l)}</option>`;
const field = (label, inner, help = "") => `<div class="field"><label>${label}</label>${inner}${help ? `<div class="help">${help}</div>` : ""}</div>`;
const inp = (id, v = "", o = {}) => `<input class="inp ${o.cls || ""}" id="${id}" value="${esc(v)}" ${o.type ? `type="${o.type}"` : ""} ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} ${o.num ? 'inputmode="decimal"' : ""} ${o.auto ? "autofocus" : ""} ${o.extra || ""}>`;
function bad(msg) { toast(msg); return false; }
const r1 = v => Math.round(v * 10) / 10;

// ------------------------------------------------------------ morning check-in (one tap each)

  commit(() => { const d = dayRec(t); d[field] = v; d.src = d.src || {}; d.src[field] = "m"; }, "check-in");

    <div class="frow">${field(`Water (${waterU()})`, inp("dWa", v(d.water, x => Math.round(waterV(x))), { num: true }))}${field("Protein (g)" + tag("protein"), inp("dPr", v(d.protein, Math.round), { num: true }))}</div>

    ${field("How you felt", `<div class="feel sm">${[1, 2, 3, 4, 5].map(i => `<button type="button" class="${d.feel === i ? "on" : ""}" data-act="dFeel" data-v="${i}"><span>${FEEL[i]}</span><small>${FEELN[i]}</small></button>`).join("")}</div><input type="hidden" id="dFe" value="${d.feel || ""}">`)}
    <label class="row" style="gap:10px;margin:4px 0 12px"><input type="checkbox" id="dRe" ${d.rest ? "checked" : ""}> <span class="small">Rest day on purpose (keeps your streak)</span></label>
    ${field("Note (optional)", inp("dNo", d.note || "", { ph: "Felt strong, new shoes…" }))}`,

function saveDay(t) {
  const map = [["steps", "dSt", x => Math.round(x), 1], ["dist", "dDi", x => x * (imperial() ? 1.609344 : 1)], ["sleep", "dSl", x => x > 24 ? x / 60 : x], ["weight", "dW", wIn], ["water", "dWa", x => Math.round(imperial() ? x * 29.5735 : x), 1],
    ["protein", "dPr", Math.round, 1], ["floors", "dFl", Math.round, 1], ["akcal", "dAk", Math.round, 1]];
  commit(() => {
    const d = dayRec(t); d.src = d.src || {};
    map.forEach(([k, id, f, whole]) => {
      const raw = val(id).trim();
      if (raw === "") { if (d[k] != null) { delete d[k]; delete d.src[k]; } return; }
      const x = whole ? numInt(raw) : num(raw); if (!(x >= 0)) return;
      const nv = Math.round(f(x) * 100) / 100, old = d[k];
      const shown = k === "dist" ? r1(distV(old || 0)) : k === "weight" ? r1(wV(old || 0)) : k === "water" ? Math.round(waterV(old || 0)) : k === "sleep" ? r1(old || 0) : Math.round(old || 0);
      if (old == null || Math.abs(shown - x) > 1e-6) { d[k] = nv; d.src[k] = "m"; }
    });
    const fe = +val("dFe"); if (fe >= 1 && fe <= 5) d.feel = fe;
    d.rest = $("#dRe").checked || undefined; if (!d.rest) delete d.rest;
    const no = val("dNo").trim(); if (no) d.note = no.slice(0, 200); else delete d.note;
  }, "edit day");
  closeModal(); toast("Saved.", () => undo());
}

// ------------------------------------------------------------ Apple Health sync: the Shortcut opens the app with ?sync=…
function readSync() {
  const q = location.search.slice(1), h = location.hash.includes("sync=") ? location.hash.slice(location.hash.indexOf("sync=")) : "";
  if (!/sync=|(^|&)st=/.test(q) && !h) return;
  let raw = q || h;
  const si = raw.search(/(^|[?&#/])sync=/); if (si >= 0) raw = raw.slice(raw.indexOf("sync=", si) + 5);   // "?sync=st=4000&di=2.8" (not encoded) keeps every value
  const { vals } = E.parseSync(raw, S.settings.units);
  history.replaceState(null, "", location.pathname + (location.hash.includes("sync=") ? "#/home" : location.hash || ""));
  const keys = Object.keys(vals).filter(k => k !== "date");
  if (!keys.length) { setTimeout(() => toast("The shortcut ran, but sent no numbers – open Settings › Apple Health to check it."), 400); return; }
  const t = vals.date || today(), d = dayRec(t), before = d.steps || 0; d.src = d.src || {};
  keys.forEach(k => { d[k] = vals[k]; d.src[k] = "h"; });
  S.lastSync = now(); S.syncs = (S.syncs || 0) + 1; save();
  const bits = [vals.steps != null ? fint(vals.steps) + " steps" : "", vals.dist ? fdist(vals.dist) : "", vals.sleep ? fsleep(vals.sleep) + " sleep" : "", vals.weight ? fw(vals.weight) : ""].filter(Boolean);
  setTimeout(() => {
    const g = S.settings.stepGoal || 8000;
    if (vals.steps >= g && before < g) { confetti(true); toast(`🎉 Step goal hit – ${fint(vals.steps)} steps!`); }
    else toast(`${ic("heart")} Synced from Apple Health${bits.length ? ": " + bits.join(" · ") : ""}`);
    document.body.classList.add("justsynced"); setTimeout(() => document.body.classList.remove("justsynced"), 1600);
  }, 350);
}

  GD = S.goal ? { ...S.goal, base: S.goal.base === "" || S.goal.base == null ? "" : S.goal.base } : null;

  modal("Choose your goal", `<div id="gPick">${goalPicker()}</div><p class="tiny faint" style="margin:10px 0 0">Estimates from common guide values for your sex, age and experience – not a promise, and not medical advice.</p>`, `${S.goal ? `<button class="btn" data-act="goalClear">Remove goal</button>` : ""}<button class="btn pri" data-act="goalSave">Save goal</button>`, { wide: 620 });
}
// keep the draft as the real goal; returns false if something is missing
function goalCommit() {
  gdRead(); if (!GD) { bad("Pick a goal first."); return false; }
  const g = gdGoal(GD), d = GC.D[g.type], t = today();
  if (!["consistency", "sleep"].includes(g.type) && !(+g.target > 0)) { bad("Enter your goal."); return false; }
  if ((d.unit === "kg" || d.unit === "cm") && !(GD.baseV > 0) && !(d.cur(S, t, g) > 0)) { bad("Add your number now – we need a starting point."); return false; }
  if (g.type === "faster5k" && !(+g.base > 0) && !(d.cur(S, t, g) > 0)) { bad("Add your 5K time now."); return false; }
  if (d.unit === "lift" && !(+g.base > 0) && !(d.cur(S, t, g) > 0)) { bad("Add your best set now."); return false; }
  if (d.unit === "kg" && GD.baseV > 0 && !(GD.baseV >= 25 && GD.baseV <= 350)) { bad("Check your weight – that number looks off."); return false; }
  if (GD.baseV > 0 && d.unit === "kg") { const kg = Math.round(GD.baseV * 10) / 10; dayRec(t).weight = kg; if (!(S.settings.startWeight > 0)) S.settings.startWeight = kg; }
  if (GD.baseV > 0 && d.unit === "cm") S.measures[t] = { ...(S.measures[t] || {}), [d.key]: Math.round(GD.baseV * 10) / 10 };
  const r = GC.weeksNeeded(S, g, t), cur = d.cur(S, t, g);
  S.goal = { type: g.type, start: t, startVal: cur, target: +g.target || GC.D[g.type].def(S, g), pace: g.pace, ex: g.ex, base: g.base === "" ? "" : +g.base, n: +g.n || 3, weeks: r.weeks || 1 };
  if (d.unit === "kg") S.settings.weightGoal = Math.round(+g.target * 10) / 10;
  return true;
}
function goalSave() { let ok; commit(() => { ok = goalCommit(); }, "goal"); if (!ok) return; closeModal(); go("goal"); render(); confetti(true); toast("Goal set – here's your plan."); }
function goalApply() {
  const s = GC.status(S, today()); if (!s) return;

  commit(() => { S.settings.proteinGoal = D2.protein; S.settings.stepGoal = Math.round(D2.steps / 500) * 500; if (["lose_weight", "lose_fat", "recomp", "gain_muscle", "gain_weight", "glutes", "upper"].includes(s.g.type)) S.settings.kcalGoal = clamp(Math.round(D2.kcal), 800, 6000); }, "daily goals");

/* "Sign in with Google": a copy of the planner lives in the buyer's own Google Drive (hidden app folder).
   Nothing goes through our servers – there are none. Only the scope drive.appdata is asked for:
   the planner can see its own file and nothing else in the Drive. */
const GCLIENT = window.BP_GOOGLE_CLIENT_ID || "";
const GFILE = "fitness-planner.json";
const GAPI = "https://www.googleapis.com";
let G = { token: "", exp: 0, client: null, busy: false, pushT: null, err: "" };

const cloudOn = () => !!(GCLIENT && S.cloud && S.cloud.on);
const tokenOk = () => G.token && now() < G.exp - 60e3;

function gisLoad() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error("Couldn't reach Google – are you online?")); document.head.appendChild(s);
  });
}
// asks Google for a short-lived access token (opens Google's own window the first time)
async function gToken(prompt) {
  await gisLoad();
  return new Promise((res, rej) => {
    G.client = google.accounts.oauth2.initTokenClient({ client_id: GCLIENT, scope: "https://www.googleapis.com/auth/drive.appdata",
      callback: r => { if (r && r.access_token) { G.token = r.access_token; G.exp = now() + (+r.expires_in || 3600) * 1000; res(); } else rej(new Error((r && r.error) || "Sign-in was cancelled.")); },
      error_callback: e => rej(new Error(e && e.type === "popup_closed" ? "Sign-in was cancelled." : "Google sign-in didn't open – allow pop-ups and try again.")) });
    G.client.requestAccessToken({ prompt });
  });
}
async function gfetch(url, o = {}) {
  const r = await fetch(url, { ...o, headers: { Authorization: "Bearer " + G.token, ...(o.headers || {}) } });
  if (r.status === 401) { G.token = ""; throw new Error("Google sign-in expired – tap Sync now."); }
  if (!r.ok) throw new Error("Google Drive said " + r.status);
  return r;
}
async function gFind() {
  const q = encodeURIComponent(`name='${GFILE}'`);
  const j = await (await gfetch(`${GAPI}/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&pageSize=5`)).json();
  return (j.files || [])[0] || null;
}
async function gRead(id) { return JSON.parse(await (await gfetch(`${GAPI}/drive/v3/files/${id}?alt=media`)).text()); }
function payload() { const d = JSON.parse(JSON.stringify(S)); delete d.cloud; return JSON.stringify({ app: "TrueHaven Fitness Planner", v: 1, saved: S.savedAt || now(), data: d }); }
async function gWrite(id) {
  const body = payload();
  if (id) { await gfetch(`${GAPI}/upload/drive/v3/files/${id}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body }); return id; }
  const b = "thfit" + Date.now(), meta = JSON.stringify({ name: GFILE, parents: ["appDataFolder"] });
  const multi = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const j = await (await gfetch(`${GAPI}/upload/drive/v3/files?uploadType=multipart&fields=id`, { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + b }, body: multi })).json();
  return j.id;
}
const hasData = d => d && ((d.workouts || []).length + Object.keys(d.days || {}).length + Object.keys(d.measures || {}).length) > 0;

// one sync step: compare what changed since the last sync on each side
//   only Drive changed → load it · only this device changed → save it · both → ask (never overwrite silently)
async function cloudSync(loud, first) {
  if (!tokenOk()) { if (!loud) { G.err = "tap"; renderSyncPill(); return; } await gToken(first ? "consent" : ""); }
  G.busy = true; renderSyncPill();
  try {
    const c = S.cloud = S.cloud || { on: true, fileId: "", lastPush: 0, seen: 0, dirty: true };
    const f = c.fileId ? { id: c.fileId } : await gFind();
    let remote = null; if (f) { try { remote = await gRead(f.id); } catch (e) { if (!c.fileId) throw e; c.fileId = ""; } }
    const rd = remote && (remote.data || remote), rs = remote ? remote.saved || 0 : 0;
    const remoteChanged = !!(remote && hasData(rd) && rs !== c.seen);
    const localChanged = !!c.dirty && hasData(S);
    if (remoteChanged && localChanged) {
      if (!loud) { G.err = "Both devices changed – tap to choose."; return; }
      const when = x => x ? new Date(x).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "unknown";
      modal("Two versions", `<p>Your Google Drive has a planner saved ${when(rs)} – and this device has changes from ${when(S.savedAt)}.</p><p class="small muted">Which one do you want to keep? The other one is replaced.</p>`,
        `<button class="btn" data-act="cloudKeepLocal">Keep this device's</button><button class="btn pri" data-act="cloudKeepRemote">Use Google Drive's</button>`);
      ACT.cloudKeepRemote = () => { closeModal(); cloudApply(remote, f.id); };
      ACT.cloudKeepLocal = async () => { closeModal(); c.fileId = f.id; await cloudWrite(true); };
      return;
    }
    if (f) c.fileId = f.id;
    if (remoteChanged || (remote && hasData(rd) && !hasData(S))) cloudApply(remote, f.id);
    else if (localChanged || !remote) await cloudWrite(loud);
    else { flushQuiet(); if (loud) toast("Everything is up to date. ☁️"); }
    G.err = "";
  } catch (e) { G.err = e.message; if (loud) toast(esc(e.message)); }
  finally { G.busy = false; renderSyncPill(); if (loud) render(); }
}
async function cloudWrite(loud) {
  const c = S.cloud; if (!S.savedAt) S.savedAt = now();
  c.fileId = await gWrite(c.fileId); c.lastPush = now(); c.seen = S.savedAt; c.dirty = false; flushQuiet();
  if (loud) toast("Saved to your Google Drive. ☁️");
}
function cloudApply(remote, id) {
  S = migrate(remote.data || remote); S.setup = true;
  S.cloud = { on: true, fileId: id, lastPush: now(), seen: remote.saved || 0, dirty: false }; S.savedAt = remote.saved || 0;
  flushQuiet(); applyTheme(); render(); toast("Your planner was loaded from Google Drive. ☁️");
}
async function cloudConnect() {
  if (DEMO) return toast("Google sync works in the full app.");
  if (!GCLIENT) return toast("Google sync isn't set up yet.");
  try { G.busy = true; render(); S.cloud = { on: true, fileId: "", lastPush: 0, seen: 0, dirty: hasData(S) }; await cloudSync(true, true); }
  catch (e) { S.cloud = null; G.err = e.message; toast(esc(e.message)); }
  finally { G.busy = false; flushQuiet(); render(); }
}
async function cloudPush() { if (cloudOn()) await cloudSync(false); }
function cloudSoon() { if (!cloudOn() || G.busy) return; clearTimeout(G.pushT); G.pushT = setTimeout(() => cloudPush(), 4000); }
async function cloudSyncNow() { if (!cloudOn()) return cloudConnect(); try { await cloudSync(true); } catch (e) { toast(esc(e.message)); } }
function cloudOff() { S.cloud = null; G.token = ""; save(); render(); toast("Signed out. Your data stays on this device – and in your Google Drive."); }
function flushQuiet() { if (DEMO) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function renderSyncPill() { const el = $("#cloudpill"); if (el) el.outerHTML = cloudPill(); }
function cloudPill() {
  if (!cloudOn()) return `<span id="cloudpill"></span>`;
  const st = G.busy ? "syncing…" : G.err === "tap" || !tokenOk() ? "tap to sync" : G.err ? "not synced" : S.cloud.lastPush ? "saved " + ago(S.cloud.lastPush) : "on";
  return `<button id="cloudpill" class="cloudpill ${G.err && G.err !== "tap" ? "bad" : ""}" data-act="cloudSync" title="Google Drive">☁️ ${st}</button>`;
}

function setSetting(k, v) {
  const st = S.settings, whole = ["stepGoal", "waterGoal", "proteinGoal", "kcalGoal", "perWeek", "cycleLen", "periodLen"].includes(k), n = whole ? numInt(v) : num(v);
  if (k === "name") st.name = v.slice(0, 40);
  else if (k === "why") st.why = v.slice(0, 120);
  else if (k === "units") st.units = v === "imperial" ? "imperial" : "metric";
  else if (k === "stepGoal" && n > 0) st.stepGoal = Math.round(n);
  else if (k === "sleepGoal" && n > 0 && n <= 14) st.sleepGoal = n;
  else if (k === "perWeek" && n >= 0 && n <= 14) st.perWeek = Math.round(n);
  else if (k === "waterGoal" && n > 0) st.waterGoal = Math.round(imperial() ? n * 29.5735 : n);
  else if (k === "proteinGoal") st.proteinGoal = n > 0 ? Math.round(n) : 0;
  else if (k === "kcalGoal") { if (String(v).trim() === "") st.kcalGoal = 0; else if (n >= 800 && n <= 6000) st.kcalGoal = Math.round(n); else setTimeout(() => toast("Calories a day: enter a number between 800 and 6,000 – or leave it empty to turn it off."), 50); }
  else if (k === "weightGoal") st.weightGoal = n > 0 ? Math.round(wIn(n) * 10) / 10 : 0;
  else if (k === "cycleLen" && n >= 18 && n <= 45) st.cycleLen = Math.round(n);
  else if (k === "periodLen" && n >= 1 && n <= 12) st.periodLen = Math.round(n);
  else if (k === "shortcut" && v.trim()) st.shortcut = v.trim().slice(0, 40);
  save();
}

function restore() {

}

  tExAdd: () => { collectTpl(); TPL.ex.push({ n: "", s: 3, r: 10 }); drawTpl(); }, tExDel: d => { collectTpl(); TPL.ex.splice(+d.i, 1); drawTpl(); },
  delTpl: d => { const tp = S.templates.find(x => x.id === d.id); modal(`Delete ${esc(tp.name)}?`, `<p>It leaves your week plan. Workouts you already logged stay.</p>`, `<button class="btn" data-act="close">Keep it</button><button class="btn danger" data-act="delTplOk" data-id="${d.id}">Delete</button>`); },
  delTplOk: d => { commit(() => { S.templates = S.templates.filter(x => x.id !== d.id); S.week = S.week.map(v => v === d.id ? "" : v); }, "delete workout"); closeModal(); toast("Deleted.", () => undo()); },
  programs: () => programsModal(), useProgram: d => useProgram(d.v),
  setGoal: () => modal("Workouts a week", `<div class="cats">${[1, 2, 3, 4, 5, 6, 7].map(v => `<button class="cat ${S.settings.perWeek === v ? "on" : ""}" data-act="setGoalV" data-v="${v}">${v}</button>`).join("")}</div>`),
  setGoalV: d => { S.settings.perWeek = +d.v; save(); closeModal(); render(); },
  // progress
  pmPrev: () => { VS.pm = E.ymAdd(VS.pm || E.ym(today()), -1); render(); }, pmNext: () => { const n = E.ymAdd(VS.pm || E.ym(today()), 1); VS.pm = n > E.ym(today()) ? E.ym(today()) : n; render(); },
  range: d => { VS.range = +d.v; render(); }, story: () => storyCard(),
  // cycle
  cmPrev: () => { VS.cm = E.ymAdd(VS.cm || E.ym(today()), -1); render(); }, cmNext: () => { VS.cm = E.ymAdd(VS.cm || E.ym(today()), 1); render(); },
  period: d => periodModal(d.v), periods: () => periodsModal(),
  savePeriod: () => { const p = val("pD"); if (!okDate(p)) return bad("Pick a date."); if (p > today()) return bad("That's in the future."); commit(() => { if (!S.periods.includes(p)) S.periods.push(p); S.periods.sort(); }, "period"); closeModal(); toast("Period logged – your plan follows your cycle.", () => undo()); },
  delPeriod: d => { commit(() => { S.periods = S.periods.filter(x => x !== d.v); }, "delete period"); periodsModal(); },
  cycleOn: () => { S.settings.cycle = true; save(); render(); }, cycleTog: () => { S.settings.cycle = !S.settings.cycle; save(); render(); },
  // settings & data
  exportCsv: () => exportCsv(), backup: () => backup(), restore: () => { if (DEMO) return toast("This works in the full app."); restore(); }, share: () => shareBackup(), install: () => installApp(),
  resetAll: () => { modal("Start fresh?", `<p>This deletes everything in the planner on this device. Download a backup first if you might want it back.</p>`, `<button class="btn" data-act="backup">Download a backup</button><button class="btn danger" data-act="resetOk">Delete everything</button>`); },
  resetOk: () => { if (DEMO) return toast("Not in the demo."); const keep = { theme: S.settings.theme, units: S.settings.units }; S = blank(); Object.assign(S.settings, keep); OB = { step: 0, d: {} }; flush(); closeModal(); location.hash = ""; render(); },
  setTheme: d => { if (!S.setup && !DEMO) obCollect(); S.settings.theme = d.v; save(); render(); }, setDark: d => { S.settings.dark = d.v; save(); render(); },
  // onboarding
  obNext: () => { obCollect(); if (!obLeave()) return render(), undefined; if (OB.step === 3 && S.settings.cycle && !okDate(OB.d.per)) { OB.d.per = ""; } OB.step++; save(); render(); scrollTo(0, 0); },
  obSkipGoal: () => { GD = null; S.goal = null; OB.d.prog = ""; OB.step++; render(); scrollTo(0, 0); },
  obBack: () => { obCollect(); OB.step--; render(); }, obDone: () => obFinish(),
  obGoal: d => { obCollect(); S.settings[d.k] = +d.v; render(); },
  obCycle: () => { obCollect(); S.settings.cycle = !S.settings.cycle; render(); },
  obProg: d => { OB.d.prog = d.v; render(); },
  obSample: () => { const s = window.BP_SAMPLE(); s.settings.theme = S.settings.theme; s.settings.units = val("obUnits") || S.settings.units; S = migrate(s); S.setup = true; S.sample = true; S.lastSync = 0; save(); go("home"); render(); toast("This is example data – Settings › Start fresh clears it."); },
  // Google Drive
  cloudConnect: () => cloudConnect(), cloudSync: () => cloudSyncNow(), cloudOff: () => cloudOff(),
  // habits
  habit: d => habitToggle(d.id, today()), habitD: d => habitToggle(d.id, d.d),
  habTog: d => { const h = S.habits.find(x => x.id === d.id); commit(() => { if (h.off) delete h.off; else h.off = true; }, "habit"); },
  habEdit: d => habitModal(d.id), habSave: d => habitSave(d.id),
  habEmo: (d, el) => { $("#hEm").value = d.v; el.parentNode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); },
  habDel: d => { commit(() => { S.habits = S.habits.filter(x => x.id !== d.id); }, "delete habit"); closeModal(); toast("Habit deleted.", () => undo()); },
  hmPrev: () => { VS.hm = E.ymAdd(VS.hm || E.ym(today()), -1); render(); }, hmNext: () => { const n = E.ymAdd(VS.hm || E.ym(today()), 1); VS.hm = n > E.ym(today()) ? E.ym(today()) : n; render(); },
  // strength & body
  exSel: d => { VS.ex = d.v; render(); }, msSel: d => { VS.ms = d.v; render(); },
  measEdit: d => measModal(d.d), measSave: d => measSave(d.d),
  measDel: d => { commit(() => { delete S.measures[d.d]; }, "delete measurements"); closeModal(); toast("Deleted.", () => undo()); },
  // workout mode
  startW: d => startSession(d.tpl),
  setDone: d => setDone(+d.i, +d.j),
  setAdd: d => { sessRead(); const e = S.session.ex[+d.i], l = e.sets[e.sets.length - 1] || { r: 10, w: 0 }; e.sets.push({ r: l.r, w: l.w, done: false }); save(); render(); },
  setDel: d => { sessRead(); const e = S.session.ex[+d.i]; if (e.sets.length > 1) e.sets.pop(); save(); render(); },
  sessAddEx: () => { sessRead(); modal("Add exercise", `${field("Exercise", `<input class="inp" id="aeN" list="exnames2" placeholder="e.g. Lateral raise" autofocus><datalist id="exnames2">${EXN.map(n => `<option value="${esc(n)}">`).join("")}</datalist>`)}`, `<button class="btn pri" data-act="sessAddExOk">Add</button>`); },
  sessAddExOk: () => { const n = val("aeN").trim(); if (!n) return bad("Name the exercise."); const l = E.lastFor(S, n, S.session.date); commit(() => { S.session.ex.push({ n: n.slice(0, 40), sets: Array.from({ length: (l && l.s) || 3 }, () => ({ r: (l && l.r) || 10, w: (l && l.w) || 0, done: false })) }); }); closeModal(); },
  restSet: () => modal("Rest between sets", `<div class="cats">${[45, 60, 90, 120, 150, 180].map(v => `<button class="cat ${S.settings.restSec === v ? "on" : ""}" data-act="restSetV" data-v="${v}">${v < 60 ? v + " s" : (v / 60) + " min"}</button>`).join("")}</div>`),
  restSetV: d => { S.settings.restSec = +d.v; save(); closeModal(); render(); },
  restAdd: () => { if (REST) { REST.end += 30000; restPaint(); } }, restSkip: () => restStop(),
  sessFinish: () => { if (!S.session.ex.some(e => e.sets.some(x => x.done))) { sessRead(); return modal("No sets ticked yet", `<p>Tick ✓ next to each set you did, then finish. Or tick them all at once:</p>`, `<button class="btn" data-act="close">Back</button><button class="btn pri" data-act="sessAll">Tick all & finish</button>`); } finishModal(); },
  sessTickRest: () => { const m = val("fM"); S.session.ex.forEach(e => e.sets.forEach(x => { if (x.r > 0 || x.w > 0) x.done = true; })); save(); finishModal(); if (m) $("#fM").value = m; },
  sessAll: () => { S.session.ex.forEach(e => e.sets.forEach(x => x.done = true)); save(); closeModal(); finishModal(); },
  finEff: (d, el) => { $("#fE").value = d.v; el.parentNode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); },
  sessSave: () => sessSave(),
  sessCancel: () => modal("Cancel this workout?", `<p>Your ticked sets won't be saved.</p>`, `<button class="btn" data-act="close">Keep going</button><button class="btn danger" data-act="sessCancelOk">Cancel workout</button>`),
  sessCancelOk: () => { commit(() => { S.session = null; }, "cancel workout"); REST = null; closeModal(); go("home"); toast("Workout cancelled.", () => undo()); },
  undo: () => undo(),
  // goal coach
  goalEdit: () => goalModal(), goalSave: () => goalSave(), goalApply: () => goalApply(),
  goalClear: () => { commit(() => { S.goal = null; }, "remove goal"); closeModal(); toast("Goal removed.", () => undo()); },
  // new pace: keep the start (and so the progress), only the remaining weeks change
  goalPace: d => { commit(() => { const g = S.goal, t = today(); g.pace = d.v; const r = GC.weeksNeeded(S, g, t); if (r.weeks != null) g.weeks = Math.max(1, Math.round(Math.max(0, E.diff(g.start, t)) / 7 + r.weeks)); }, "pace"); },
  gdCat: d => { gdRead(); VS.gcat = d.v; gdRedraw(); },
  gdType: d => { gdRead(); GD = gdNew(d.v); gdRedraw(); const f = $("#gTg") || $("#gBase"); f && matchMedia("(min-width:761px)").matches && f.focus(); },
  gdPace: d => { gdRead(); GD.pace = d.v; gdRedraw(); },
  gdN: d => { gdRead(); GD.n = +d.v; gdRedraw(); },
  aboutEdit: () => aboutModal(false), aboutSave: d => aboutSave(!!d.then),
  abSex: (d, el) => { VS.abSex = d.v; if (!S.setup && !DEMO) { aboutRead(); S.settings.sex = d.v; if (d.v === "m") S.settings.cycle = false; render(); return; } el.parentNode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); }
};

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) { if (e.target.closest(".modal a")) closeModal(); return; }
  const f = ACT[a.dataset.act]; if (!f) return;
  e.preventDefault(); f(a.dataset, a);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && (el.dataset.sr || el.dataset.sw) && S.session) { sessRead(); save(); }
  if (el.dataset && el.dataset.gd) gdLive();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.set) { setSetting(el.dataset.set, el.value); render(); return; }
  if (el.id === "gEx") { gdRead(); GD.target = GC.D.lift.def(S, GD); gdRedraw(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest && e.target.closest(".modal") && e.target.tagName === "INPUT" && $(".modal .mf .btn.pri")) { e.preventDefault(); $(".modal .mf .btn.pri").click(); } });
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !modalOpen) { e.preventDefault(); undo(); } });
// coming back to the tab (e.g. after the shortcut ran in another tab): refresh "today"
document.addEventListener("visibilitychange", () => { if (!document.hidden && !modalOpen) render(); });

// service worker for offline use (only when served over http/https)
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol) && !window.BP_NO_SW) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
try { if (!DEMO && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
readSync();
render();
</script>
</body></html>
